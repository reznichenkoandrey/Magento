# The gates for this repo.
#
# Five of them need nothing but a clean runner. The sixth, `magento-suite`, needs a Magento
# installation — the unit suite needs the framework and `phpstan.neon` needs `vendor/` — and
# installing Magento needs authenticated access to repo.magento.com. That means two repository
# secrets, so the job checks for them first and skips with a reason rather than failing when they
# are absent: a fork has no access to them and should still get the other five.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: php -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint every PHP and PHTML file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || { echo "::error file=$file::PHP parse error"; status=1; }
          done < <(find . -path ./vendor -prune -o \( -name '*.php' -o -name '*.phtml' \) -print)
          exit $status

  xml:
    name: xmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest does not ship libxml2-utils.
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Validate every XML file is well-formed
        run: |
          # Without this, a missing binary reports as every file being malformed.
          command -v xmllint > /dev/null || { echo "::error::xmllint is not installed"; exit 1; }
          status=0
          while IFS= read -r file; do
            xmllint --noout "$file" || { echo "::error file=$file::malformed XML"; status=1; }
          done < <(find . -name '*.xml' -not -path './vendor/*')
          exit $status

  graphql-schemas:
    name: graphql schema gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Magento splits .graphqls with a regex rather than parsing it, so a schema keyword
      # inside a comment silently swallows the declaration under it and breaks schema
      # generation for every GraphQL request. Nothing else in this file observes that.
      - run: php tools/check-graphql-schemas.php

  js:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Every package is dependency-free and runs on the built-in test runner, so there
      # is nothing to install.
      - name: Run each package's suite
        run: |
          status=0
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            echo "--- $dir"
            (cd "$dir" && npm test) || { echo "::error file=$manifest::suite failed"; status=1; }
          done < <(find . -name package.json -not -path '*/node_modules/*')
          exit $status

  phpcs:
    name: phpcs (Magento2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install the Magento coding standard
        run: |
          mkdir -p "$RUNNER_TEMP/phpcs" && cd "$RUNNER_TEMP/phpcs"
          composer init --no-interaction --name=scr1be/phpcs-runner
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --no-interaction --dev magento/magento-coding-standard
      # No standard is named here on purpose: phpcs.xml at the repo root is the standard, and it
      # carries the two exclusions with the reason for each. Passing --standard=Magento2 would
      # bypass it. Warnings are the stock docblock ones and are not a gate; errors are.
      - name: Run phpcs
        run: |
          "$RUNNER_TEMP/phpcs/vendor/bin/phpcs" \
            --warning-severity=0 --report=full \
            $(ls -d */src)

  magento-suite:
    name: phpunit
    runs-on: ubuntu-latest
    env:
      MAGENTO_VERSION: 2.4.8-p4
    steps:
      # Secrets are unavailable to forked pull requests by design, and an absent secret is an
      # empty string rather than an error. Deciding here keeps every later step honest about why
      # it did nothing.
      - name: Check for repo.magento.com credentials
        id: creds
        env:
          PUBLIC_KEY: ${{ secrets.MAGENTO_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.MAGENTO_PRIVATE_KEY }}
        run: |
          if [ -n "$PUBLIC_KEY" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MAGENTO_PUBLIC_KEY / MAGENTO_PRIVATE_KEY are not set, so Magento cannot be installed. The unit suite and phpstan are skipped; the other five gates still ran."
          fi

      - if: steps.creds.outputs.available == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - if: steps.creds.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-magento-${{ env.MAGENTO_VERSION }}-${{ hashFiles('**/tools/phpstan/composer.lock') }}
          restore-keys: composer-magento-${{ env.MAGENTO_VERSION }}-

      # The installation, and only the installation — no database, no `setup:install`. Everything
      # below reads source and resolves classes; none of it queries anything.
      - name: Install Magento
        if: steps.creds.outputs.available == 'true'
        env:
          COMPOSER_AUTH: >-
            {"http-basic":{"repo.magento.com":{"username":"${{ secrets.MAGENTO_PUBLIC_KEY }}","password":"${{ secrets.MAGENTO_PRIVATE_KEY }}"}}}
        run: |
          composer create-project --no-interaction --no-progress \
            --repository-url=https://repo.magento.com/ \
            magento/project-community-edition="$MAGENTO_VERSION" magento

      # Into `magento/Magento`, because that is where the repo sits on the demo stand and every
      # relative path in phpstan.neon is written from there.
      - name: Check out the modules
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          path: magento/Magento

      - name: Lay the modules out where Magento expects them
        if: steps.creds.outputs.available == 'true'
        working-directory: magento/Magento
        run: php tools/sync-to-app-code.php

      # Magento registers Qameta's Allure extension and ships no config for it, so it aborts its
      # own bootstrap and PHPUnit records a warning — which PHPUnit 10 exits non-zero for. The
      # extension only needs the file to return an array. Satisfying it here beats passing
      # `--do-not-fail-on-warning`, which would hide our own warnings along with this one.
      - name: Unit suite
        if: steps.creds.outputs.available == 'true'
        working-directory: magento
        run: |
          mkdir -p allure
          printf '<?php\n\nreturn [];\n' > allure/allure.config.php
          php -d memory_limit=2G vendor/bin/phpunit \
            -c dev/tests/unit/phpunit.xml.dist --no-coverage --do-not-cache-result \
            app/code/Scr1be

      # PHPStan is not here, and cannot be. Two of the modules type-hint `Hyva\Theme\…` in
      # their constructors, and Hyvä ships from a licensed private Packagist that a public
      # repository has no credentials for — without it the analysis reports 80 unresolvable
      # classes and everything that cascades from them. It stays a manual gate, documented in
      # CONTRIBUTING.md, and so does the extension test that needs it.

      - name: Drift
        if: steps.creds.outputs.available == 'true'
        working-directory: magento/Magento
        run: php tools/sync-to-app-code.php --check
